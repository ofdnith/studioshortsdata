{% extends "base.html" %}
{% block titulo %}Produção{% endblock %}
{% block conteudo %}
<div class="cabecalho"><h1>Produção</h1></div>

{% if not tem_chave %}
<div class="alerta falha">Sem chave para o modelo padrão (<code>{{ esc.modelo }}</code>): os roteiros não serão gerados.
  <a href="/ia">Configure na tela IA</a>.</div>
{% endif %}

<div id="fila-viva" hx-get="/producao/fila" hx-trigger="every 3s" hx-swap="innerHTML">
  {% include "_fila.html" %}
</div>

{% endblock %}
