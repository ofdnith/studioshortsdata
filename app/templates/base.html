<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Estúdio{% endblock %} · Estúdio</title>
  <link rel="stylesheet" href="/static/estilo.css">
  <script src="/static/htmx.min.js" defer></script>
</head>
<body>
  <header class="topo">
    <a class="marca" href="/">Estúdio<span class="ponto">.</span></a>
    <nav class="abas">
      <a href="/temas" class="{{ 'ativa' if aba == 'temas' }}">Temas</a>
      <a href="/producao" class="{{ 'ativa' if aba == 'producao' }}">Produção</a>
      <a href="/agenda" class="{{ 'ativa' if aba == 'agenda' }}">Agenda</a>
      <a href="/ia" class="{{ 'ativa' if aba == 'config' }}">Configurações</a>
    </nav>
    {% if ficticio %}<span class="aviso-ficticio">dados fictícios</span>{% endif %}
  </header>

  <main class="conteudo">
    <div id="mensagem">
      {% if msg %}<div class="alerta ok">{{ msg }}</div>{% endif %}
      {% if erro %}<div class="alerta falha">{{ erro }}</div>{% endif %}
    </div>
    {% block conteudo %}{% endblock %}
  </main>

  {% if dev %}
  <script>
    // Recarregamento automático em desenvolvimento: quando o servidor reinicia
    // (você editou um .py, .html ou .css), a página recarrega sozinha.
    (function () {
      let boot = null;
      setInterval(async () => {
        try {
          const r = await fetch("/_dev/boot", { cache: "no-store" });
          const id = await r.text();
          if (boot && id !== boot) location.reload();
          boot = id;
        } catch (e) { /* servidor reiniciando */ }
      }, 1000);
    })();
  </script>
  {% endif %}
  {% block scripts %}{% endblock %}
</body>
</html>
