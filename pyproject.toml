[project]
name = "estudio"
version = "0.1.0"
description = "Estúdio local de vídeos curtos: temas, produção e agenda"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=2.3.0",
    "fastapi>=0.162.0",
    "honcho>=2.0.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "kokoro-onnx>=0.6.1",
    "numpy>=2.5.4",
    "python-multipart>=0.0.33",
    "scipy>=1.18.1",
    "skia-python>=144.1",
    "soundfile>=0.14.0",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false
